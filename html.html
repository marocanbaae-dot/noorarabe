    const AudioEngine = {
      rate: 0.80,
      currentAudio: null,
      audioCtx: null,
      voices: [],
      toastTimer: null,

      init() {
        if ('speechSynthesis' in window) {
          const load = () => { this.voices = window.speechSynthesis.getVoices() || []; };
          load();
          window.speechSynthesis.onvoiceschanged = load;
        }
      },

      getArabicVoice() {
        if (!this.voices.length && 'speechSynthesis' in window) {
          this.voices = window.speechSynthesis.getVoices() || [];
        }
        return (
          this.voices.find(v => v.lang.toLowerCase().startsWith('ar-sa')) ||
          this.voices.find(v => v.lang.toLowerCase().startsWith('ar-eg')) ||
          this.voices.find(v => v.lang.toLowerCase().startsWith('ar')) ||
          null
        );
      },

      showToast(text) {
        const toast = document.getElementById('audio-toast');
        const label = document.getElementById('audio-toast-text');
        if (!toast || !label) return;
        label.textContent = text;
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => {
          toast.classList.add('hidden');
          toast.classList.remove('flex');
        }, 2200);
      },

      // Normalize short syllables so Arabic TTS engines pronounce the vowel clearly
      prepareText(rawText) {
        if (!rawText) return '';
        const t = String(rawText).trim();
        // Sukun on a single letter (e.g., بْ) is easier to hear as "أَبْ"
        if (t.length === 2 && t.endsWith('\u0652')) {
          return 'أَ' + t;
        }
        return t;
      },

      stopAll() {
        if (this.currentAudio) {
          try {
            this.currentAudio.pause();
            this.currentAudio.currentTime = 0;
          } catch (e) {}
          this.currentAudio = null;
        }
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
      },

      // Primary reliable playback: tries Online Arabic TTS MP3 first (works even without OS Arabic voices),
      // and seamlessly falls back to browser Web Speech API if offline or blocked.
      speak(rawText) {
        const text = this.prepareText(rawText);
        if (!text) return;
        this.stopAll();
        this.showToast(rawText);

        // Layer 1: Direct Arabic TTS Audio Stream (works on Windows/Mac/iOS/Android even with no local Arabic pack)
        const ttsUrl = `https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=ar&client=gtx&q=${encodeURIComponent(text)}`;
        const audio = new Audio(ttsUrl);
        audio.playbackRate = this.rate < 0.85 ? 0.82 : 1.0;
        this.currentAudio = audio;

        let fellBack = false;
        const fallbackToWebSpeech = () => {
          if (fellBack) return;
          fellBack = true;
          this.speakWithBrowserTTS(text);
        };

        audio.onerror = fallbackToWebSpeech;
        const playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(fallbackToWebSpeech);
        }
      },

      // Layer 2: Browser Web Speech API with Chrome cancel/resume bug workaround
      speakWithBrowserTTS(text) {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          const utter = new SpeechSynthesisUtterance(text);
          const arVoice = this.getArabicVoice();
          utter.lang = arVoice ? arVoice.lang : 'ar-SA';
          if (arVoice) utter.voice = arVoice;
          utter.rate = this.rate;
          utter.pitch = 1.02;
          setTimeout(() => {
            try { window.speechSynthesis.speak(utter); } catch (e) {}
          }, 40);
        } catch (e) {
          // Silent fallback
        }
      },

      // Pleasant Web Audio Chimes (no external files)
      playChime(type = 'success') {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!this.audioCtx) this.audioCtx = new Ctx();
          if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
          const ctx = this.audioCtx;
          const now = ctx.currentTime;

          const tone = (freq, start, dur, vol = 0.11) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.001, start);
            gain.gain.exponentialRampToValueAtTime(vol, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + dur + 0.03);
          };

          if (type === 'success') {
            tone(523.25, now, 0.13);
            tone(659.25, now + 0.09, 0.15);
            tone(783.99, now + 0.18, 0.22);
          } else if (type === 'celebrate') {
            tone(523.25, now, 0.11);
            tone(659.25, now + 0.09, 0.11);
            tone(783.99, now + 0.18, 0.11);
            tone(1046.5, now + 0.28, 0.34, 0.14);
          } else {
            tone(330, now, 0.13, 0.07);
          }
        } catch (e) {}
      }
    };

        default: {

    }

    /* ============================================================================
       4. APPLICATION STATE & PERSISTENCE (WITH SAFE LOCALSTORAGE)
       ============================================================================ */

    const STORAGE_KEY = 'noor_arabic_reader_v1';

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    const saved = loadSavedState();

    const State = {
      view: 'home', // home | unit1 | unit2 | unit3 | unit4 | unit5 | games | diagnostic | review | teacher
      activeGame: null,
      stars: saved?.stars || 0,
      badges: saved?.badges || [],
      stats: saved?.stats || {},
      reviewQueue: saved?.reviewQueue || [],
      completedActivities: saved?.completedActivities || 0,
      lastActivity: saved?.lastActivity || 'Découverte',
      mascot: {
        mood: 'happy',
        fr: 'Bonjour ! Je suis Noor. Prête à jouer avec les lettres ?',
        ar: 'مَرْحَبًا! أَنَا نُورُ. هَلْ أَنْتِ مُسْتَعِدَّةٌ؟'
      },
      remediation: null,
      showBadges: false,
      teacherUnlocked: false,
      pinError: false,
      teacherConfig: saved?.teacherConfig || {
        focusLetters: ['ب', 'ت', 'ث', 'ج', 'ح', 'خ'],
        difficulty: 'easy',
        selectedWordIds: VOCABULARY.filter(w => w.core).map(w => w.id)
      },
      // Unit & Game sub-states
      u1: { groupId: 'g_ba', char: 'ب', mode: 'explore', quizTarget: null, quizOptions: [], feedback: null, streak: 0 },
      u2: { anchor: 'ب', tab: 'learn', targetHaraka: HARAKAT_DATA[0], trainLetter: 'ب', spotPair: null, feedback: null, score: 0 },
      u3: { tab: 'builder', consonant: 'ب', harakaId: 'fatha', quizTarget: null, quizOptions: [], feedback: null, wins: 0 },
      u4: { tab: 'cards', showSyllables: true, quizWord: null, quizOpts: [], wins: 0 },
      u5: { idx: 0, activity: 'read', ordered: [], pool: [], status: null },
      diag: { step: 0, done: false },
      revIdx: 0,
      gHunter: { target: 'ب', bubbles: [], found: 0 },
      gDots: { target: 'ب', solved: false, wins: 0 },
      gOdd: { round: null, wins: 0 },
      gMem: { cards: [], flipped: [], matched: [] },
      gBuild: { word: VOCABULARY[0], picked: [], pool: [], status: null },
      gMatch: { target: VOCABULARY[0], opts: [] }
    };

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          stars: State.stars,
          badges: State.badges,
          stats: State.stats,
          reviewQueue: State.reviewQueue,
          completedActivities: State.completedActivities,
          lastActivity: State.lastActivity,
          teacherConfig: State.teacherConfig
        }));
      } catch (e) {}
    }

    /* ============================================================================
       5. HELPERS & ADAPTIVE ENGINE
       ============================================================================ */

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function randomFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getChoiceCount() {
      return State.teacherConfig.difficulty === 'easy' ? 3 : State.teacherConfig.difficulty === 'medium' ? 4 : 5;
    }

    function recordAttempt({ kind, id, isCorrect, chosen = null, activityLabel = '' }) {
      const key = `${kind}:${id}`;
      if (activityLabel) State.lastActivity = activityLabel;

      const cur = State.stats[key] || { kind, id, correct: 0, errors: 0, confusedWith: {} };
      if (!isCorrect && chosen && chosen !== id) {
        cur.confusedWith[chosen] = (cur.confusedWith[chosen] || 0) + 1;
      }
      cur.correct += isCorrect ? 1 : 0;
      cur.errors += isCorrect ? 0 : 1;
      State.stats[key] = cur;

      if (isCorrect) {
        AudioEngine.playChime('success');
        State.stars += 1;
        const msg = randomFrom(PRAISE_MESSAGES);
        State.mascot = { mood: 'excited', fr: msg.fr, ar: msg.ar };
        if (cur.correct >= 3) {
          State.reviewQueue = State.reviewQueue.filter(item => !(item.kind === kind && item.id === id));
        }
      } else {
        AudioEngine.playChime('gentle');
        const msg = randomFrom(ENCOURAGE_MESSAGES);
        State.mascot = { mood: 'happy', fr: msg.fr, ar: msg.ar };
        if (!State.reviewQueue.some(x => x.kind === kind && x.id === id)) {
          State.reviewQueue.push({ kind, id, confusedWith: chosen });
        }
        if ((kind === 'letter' || kind === 'haraka') && chosen && chosen !== id) {
          State.remediation = { kind, expected: id, chosen };
        }
      }
      saveProgress();
    }

    function awardBadge(id, titleFr, titleAr) {
      State.completedActivities += 1;
      if (!State.badges.some(b => b.id === id)) {
        AudioEngine.playChime('celebrate');
        State.badges.push({ id, titleFr, titleAr });
      }
      saveProgress();
    }

    function computeAnalytics() {
      const entries = Object.values(State.stats);
      const totalCorrect = entries.reduce((a, e) => a + e.correct, 0);
      const totalErrors = entries.reduce((a, e) => a + e.errors, 0);
      const masteredLetters = entries
        .filter(e => e.kind === 'letter' && e.correct >= 3 && e.correct / (e.correct + e.errors) >= 0.7)
        .map(e => e.id);
      const weakLetters = entries
        .filter(e => e.kind === 'letter' && e.errors > 0 && (e.correct < 3 || e.errors >= e.correct))
        .map(e => ({ id: e.id, errors: e.errors, confusedWith: Object.keys(e.confusedWith) }));
      const harakatStats = HARAKAT_DATA.map(h => {
        const st = State.stats[`haraka:${h.id}`] || { correct: 0, errors: 0 };
        return { ...h, ...st };
      });
      const masteredSyllables = entries.filter(e => e.kind === 'syllable' && e.correct >= 2).map(e => e.id);

      let suggestedNext = { labelFr: 'Unité 1 : Famille ب ت ث', targetView: 'unit1' };
      if (weakLetters.length > 0) {
        suggestedNext = { labelFr: `Révision Magique (${weakLetters.map(w => w.id).join('، ')})`, targetView: 'review' };
      } else if (harakatStats.every(h => h.correct === 0)) {
        suggestedNext = { labelFr: 'Unité 2 : Découvrir les Harakat', targetView: 'unit2' };
      } else if (masteredSyllables.length < 3) {
        suggestedNext = { labelFr: 'Unité 3 : Assembler les Syllabes', targetView: 'unit3' };
      } else {
        suggestedNext = { labelFr: 'Unité 4 : Mots Illustrés', targetView: 'unit4' };
      }
      return { totalCorrect, totalErrors, masteredLetters, weakLetters, harakatStats, suggestedNext };
    }

    /* ============================================================================
       6. NAVIGATION & ACTIVITY SETUP ACTIONS
       ============================================================================ */

    window.App = {
      speak(text) { AudioEngine.speak(text); },

      toggleRate() {
        AudioEngine.rate = AudioEngine.rate < 0.85 ? 0.96 : 0.76;
        AudioEngine.speak('مَرْحَبًا');
        render();
      },

      go(view, gameId = null) {
        AudioEngine.stopAll();
        State.view = view;
        State.activeGame = gameId;
        if (view === 'diagnostic') {
          State.diag = { step: 0, done: false };
          setTimeout(() => AudioEngine.speak('بَ'), 180);
        }
        if (view === 'games' && gameId) {
          this.startGame(gameId);
          return;
        }
        render();
      },

      openBadges(show) {
        State.showBadges = show;
        render();
      },

      closeRemediation() {
        State.remediation = null;
        render();
      },

      /* --- Unit 1 --- */
      u1SelectGroup(gid) {
        const grp = LETTER_GROUPS.find(g => g.id === gid) || LETTER_GROUPS[0];
        State.u1.groupId = grp.id;
        State.u1.char = grp.letters[0];
        State.u1.mode = 'explore';
        render();
      },
      u1SelectChar(ch) {
        State.u1.char = ch;
        AudioEngine.speak(LETTERS_DATA[ch].sound);
        render();
      },
      u1SetMode(m) {
        State.u1.mode = m;
        if (m === 'quiz') this.u1NextQuiz();
        else render();
      },
      u1NextQuiz() {
        const grp = LETTER_GROUPS.find(g => g.id === State.u1.groupId) || LETTER_GROUPS[0];
        const target = randomFrom(grp.letters);
        const pool = [...grp.letters];
        const all = Object.keys(LETTERS_DATA);
        while (pool.length < Math.min(getChoiceCount(), Math.max(3, grp.letters.length))) {
          const extra = randomFrom(all);
          if (!pool.includes(extra)) pool.push(extra);
        }
        State.u1.quizTarget = target;
        State.u1.quizOptions = shuffle(pool);
        State.u1.feedback = null;
        AudioEngine.speak(LETTERS_DATA[target].sound);
        render();
      },
      u1Answer(ch) {
        const grp = LETTER_GROUPS.find(g => g.id === State.u1.groupId) || LETTER_GROUPS[0];
        if (ch === State.u1.quizTarget) {
          State.u1.feedback = 'ok';
          State.u1.streak += 1;
          recordAttempt({ kind: 'letter', id: State.u1.quizTarget, isCorrect: true, activityLabel: `Lettres : ${grp.titleFr}` });
          if (State.u1.streak === 4) awardBadge(`u1_${grp.id}`, `Championne : ${grp.letters.join(' ')}`, grp.titleAr);
          render();
          setTimeout(() => this.u1NextQuiz(), 950);
        } else {
          State.u1.feedback = 'retry';
          recordAttempt({ kind: 'letter', id: State.u1.quizTarget, isCorrect: false, chosen: ch, activityLabel: `Lettres : ${grp.titleFr}` });
          render();
        }
      },

      /* --- Unit 2 --- */
      u2Anchor(ch) {
        State.u2.anchor = ch;
        AudioEngine.speak(ch + HARAKAT_DATA[0].mark);
        render();
      },
      u2Tab(tab) {
        State.u2.tab = tab;
        if (tab === 'listen') this.u2NextListen();
        else if (tab === 'train') this.u2NextTrain();
        else if (tab === 'spotError') this.u2NextSpot();
        else render();
      },
      u2NextListen() {
        const picked = randomFrom(HARAKAT_DATA.filter(h => h.type === 'short'));
        State.u2.targetHaraka = picked;
        State.u2.feedback = null;
        AudioEngine.speak(State.u2.anchor + picked.mark);
        render();
      },
      u2NextTrain() {
        const l = randomFrom(['ب', 'م', 'س', 'ت', 'ل', 'د']);
        const h = randomFrom(HARAKAT_DATA.slice(0, 3));
        State.u2.trainLetter = l;
        State.u2.targetHaraka = h;
        State.u2.feedback = null;
        AudioEngine.speak(l + h.mark);
        render();
      },
      u2NextSpot() {
        const l = randomFrom(['ب', 'م', 'س', 'ت', 'د']);
        const spokenH = randomFrom(HARAKAT_DATA.slice(0, 3));
        const isMatch = Math.random() > 0.5;
        const shownH = isMatch ? spokenH : randomFrom(HARAKAT_DATA.slice(0, 3).filter(x => x.id !== spokenH.id));
        State.u2.spotPair = { letter: l, spokenH, shownH, isMatch };
        State.u2.feedback = null;
        AudioEngine.speak(l + spokenH.mark);
        render();
      },
      u2ChooseHaraka(hid) {
        const target = State.u2.targetHaraka;
        if (hid === target.id) {
          State.u2.feedback = 'ok';
          State.u2.score += 1;
          recordAttempt({ kind: 'haraka', id: target.id, isCorrect: true, activityLabel: 'Harakat' });
          if (State.u2.score === 5) awardBadge('unit2_harakat', 'Reine des Voyelles', 'بَطَلَةُ الْحَرَكَاتِ');
          render();
          setTimeout(() => (State.u2.tab === 'train' ? this.u2NextTrain() : this.u2NextListen()), 950);
        } else {
          State.u2.feedback = 'retry';
          recordAttempt({ kind: 'haraka', id: target.id, isCorrect: false, chosen: hid, activityLabel: 'Harakat' });
          render();
        }
      },
      u2SpotAnswer(userSaysYes) {
        const sp = State.u2.spotPair;
        const ok = userSaysYes === sp.isMatch;
        recordAttempt({ kind: 'haraka', id: sp.spokenH.id, isCorrect: ok, chosen: ok ? null : sp.shownH.id, activityLabel: 'Harakat : Vrai/Faux' });
        State.u2.feedback = ok ? 'ok' : 'retry';
        render();
        if (ok) setTimeout(() => this.u2NextSpot(), 900);
      },

      /* --- Unit 3 --- */
      u3Tab(tab) {
        State.u3.tab = tab;
        if (tab === 'quiz') this.u3NextQuiz();
        else render();
      },
      u3SetConsonant(c) {
        State.u3.consonant = c;
        const h = HARAKAT_DATA.find(x => x.id === State.u3.harakaId) || HARAKAT_DATA[0];
        AudioEngine.speak(c + h.mark);
        render();
      },
      u3SetHaraka(hid) {
        State.u3.harakaId = hid;
        const h = HARAKAT_DATA.find(x => x.id === hid) || HARAKAT_DATA[0];
        AudioEngine.speak(State.u3.consonant + h.mark);
        render();
      },
      u3NextQuiz() {
        const c = randomFrom(SYLLABLE_CONSONANTS.slice(0, 7));
        const hs = [HARAKAT_DATA[0], HARAKAT_DATA[1], HARAKAT_DATA[2], HARAKAT_DATA[4], HARAKAT_DATA[5], HARAKAT_DATA[6]];
        const targetH = randomFrom(hs);
        const targetText = c + targetH.mark;
        const opts = new Set([targetText]);
        while (opts.size < 4) opts.add(c + randomFrom(hs).mark);
        State.u3.quizTarget = targetText;
        State.u3.quizOptions = shuffle(Array.from(opts));
        State.u3.feedback = null;
        AudioEngine.speak(targetText);
        render();
      },
      u3Answer(opt) {
        const ok = opt === State.u3.quizTarget;
        recordAttempt({ kind: 'syllable', id: State.u3.quizTarget, isCorrect: ok, activityLabel: 'Syllabes' });
        State.u3.feedback = ok ? 'ok' : 'retry';
        if (ok) {
          State.u3.wins += 1;
          if (State.u3.wins === 5) awardBadge('unit3_syl', 'As des Syllabes', 'بَطَلَةُ الْمَقَاطِعِ');
          render();
          setTimeout(() => this.u3NextQuiz(), 900);
        } else {
          render();
        }
      },

      /* --- Unit 4 --- */
      u4Tab(tab) {
        State.u4.tab = tab;
        if (tab === 'quiz') this.u4NextQuiz();
        else render();
      },
      u4ToggleSyl() {
        State.u4.showSyllables = !State.u4.showSyllables;
        render();
      },
      u4NextQuiz() {
        const words = VOCABULARY.filter(w => State.teacherConfig.selectedWordIds.includes(w.id));
        const pool = words.length >= 3 ? words : VOCABULARY.slice(0, 12);
        const target = randomFrom(pool);
        const others = shuffle(pool.filter(w => w.id !== target.id)).slice(0, 2);
        State.u4.quizWord = target;
        State.u4.quizOpts = shuffle([target, ...others]);
        AudioEngine.speak(target.ar);
        render();
      },
      u4Answer(wid) {
        const ok = wid === State.u4.quizWord.id;
        recordAttempt({ kind: 'word', id: State.u4.quizWord.id, isCorrect: ok, activityLabel: 'Mots : Image' });
        if (ok) {
          State.u4.wins += 1;
          if (State.u4.wins === 5) awardBadge('unit4_words', 'Exploratrice de Mots', 'بَطَلَةُ الْكَلِمَاتِ');
          render();
          setTimeout(() => this.u4NextQuiz(), 850);
        } else {
          render();
        }
      },

      /* --- Unit 5 --- */
      u5Activity(act) {
        State.u5.activity = act;
        State.u5.status = null;
        if (act === 'order') this.u5SetupOrder();
        else render();
      },
      u5Change(delta) {
        State.u5.idx = (State.u5.idx + delta + SENTENCES_DATA.length) % SENTENCES_DATA.length;
        State.u5.status = null;
        if (State.u5.activity === 'order') this.u5SetupOrder();
        else render();
      },
      u5SetupOrder() {
        const s = SENTENCES_DATA[State.u5.idx];
        State.u5.ordered = [];
        State.u5.pool = shuffle(s.words);
        State.u5.status = null;
        render();
      },
      u5PickOrder(poolIdx) {
        const s = SENTENCES_DATA[State.u5.idx];
        const word = State.u5.pool[poolIdx];
        State.u5.ordered.push(word);
        State.u5.pool.splice(poolIdx, 1);
        if (State.u5.pool.length === 0) {
          const ok = State.u5.ordered.join(' ') === s.words.join(' ');
          State.u5.status = ok ? 'ok' : 'retry';
          recordAttempt({ kind: 'sentence', id: s.id, isCorrect: ok, activityLabel: 'Phrases : Ordre' });
          if (ok) {
            AudioEngine.speak(s.ar);
            if (State.u5.idx === SENTENCES_DATA.length - 1) awardBadge('unit5_sent', 'Petite Lectrice', 'قَارِئَةٌ صَغِيرَةٌ');
          }
        }
        render();
      },
      u5Complete(opt) {
        const s = SENTENCES_DATA[State.u5.idx];
        const ok = opt === s.words[s.missingWordIdx];
        State.u5.status = ok ? 'ok' : 'retry';
        recordAttempt({ kind: 'sentence', id: s.id, isCorrect: ok, activityLabel: 'Phrases : Compléter' });
        if (ok) AudioEngine.speak(s.ar);
        render();
      },

      /* --- Diagnostic --- */
      diagAnswer(val, qKind, qId) {
        const ok = val === qId;
        recordAttempt({ kind: qKind, id: qId, isCorrect: ok, chosen: ok ? null : val, activityLabel: 'Défi Découverte' });
        if (State.diag.step + 1 < 6) {
          State.diag.step += 1;
          const nextAudios = ['بَ', 'جَ', 'شَ', 'بَ', 'بِ', 'بَابٌ'];
          render();
          setTimeout(() => AudioEngine.speak(nextAudios[State.diag.step]), 350);
        } else {
          State.diag.done = true;
          awardBadge('diag_done', 'Aventurière', 'مُغَامِرَةٌ شُجَاعَةٌ');
          render();
        }
      },

      /* --- Adaptive Review --- */
      reviewAnswer(val, itemKind, itemId) {
        const ok = val === itemId;
        recordAttempt({ kind: itemKind, id: itemId, isCorrect: ok, chosen: ok ? null : val, activityLabel: 'Révision Magique' });
        if (ok) State.revIdx += 1;
        render();
      },

      /* --- Games Arcade --- */
      startGame(gid) {
        State.view = 'games';
        State.activeGame = gid;
        if (gid === 'hunter') this.initHunter();
        else if (gid === 'dots') this.initDots();
        else if (gid === 'odd') this.initOdd();
        else if (gid === 'memory') this.initMemory();
        else if (gid === 'buildWord') this.initBuildWord();
        else if (gid === 'matchWord') this.initMatchWord();
        else render();
      },

      initHunter() {
        const pool = State.teacherConfig.focusLetters.length >= 3 ? State.teacherConfig.focusLetters : ['ب', 'ت', 'ث', 'ج', 'ح', 'خ'];
        const target = randomFrom(pool);
        const items = [];
        for (let i = 0; i < 3; i++) items.push({ id: `t_${i}`, char: target, popped: false });
        while (items.length < 9) {
          const d = randomFrom(pool.filter(c => c !== target));
          items.push({ id: `d_${items.length}`, char: d, popped: false });
        }
        State.gHunter = { target, bubbles: shuffle(items), found: 0 };
        AudioEngine.speak(LETTERS_DATA[target]?.sound || target);
        render();
      },
      tapBubble(bid) {
        const b = State.gHunter.bubbles.find(x => x.id === bid);
        if (!b || b.popped) return;
        if (b.char === State.gHunter.target) {
          b.popped = true;
          State.gHunter.found += 1;
          recordAttempt({ kind: 'letter', id: State.gHunter.target, isCorrect: true, activityLabel: 'Jeu : Chasseur' });
          render();
          if (State.gHunter.found === 3) {
            awardBadge('game_hunter', 'Chasseuse de Lettres', 'صَائِدَةُ الْحُرُوفِ');
            setTimeout(() => this.initHunter(), 950);
          }
        } else {
          recordAttempt({ kind: 'letter', id: State.gHunter.target, isCorrect: false, chosen: b.char, activityLabel: 'Jeu : Chasseur' });
          render();
        }
      },

      initDots() {
        const dotLetters = ['ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'س', 'ش', 'ف', 'ق'];
        const next = randomFrom(dotLetters);
        State.gDots.target = next;
        State.gDots.solved = false;
        AudioEngine.speak(LETTERS_DATA[next].sound);
        render();
      },
      pickDots(dots, pos) {
        const info = LETTERS_DATA[State.gDots.target];
        const ok = dots === info.dots && pos === info.dotPos;
        recordAttempt({ kind: 'letter', id: State.gDots.target, isCorrect: ok, activityLabel: 'Jeu : Points' });
        if (ok) {
          State.gDots.solved = true;
          State.gDots.wins += 1;
          if (State.gDots.wins === 4) awardBadge('game_dots', 'Détective des Points', 'مُكْتَشِفَةُ النُّقَاطِ');
          render();
          setTimeout(() => this.initDots(), 1050);
        } else {
          render();
        }
      },

      initOdd() {
        const grp = randomFrom(LETTER_GROUPS.slice(0, 9));
        const main = grp.letters[0];
        const odd = randomFrom(grp.letters.filter(l => l !== main));
        State.gOdd.round = {
          main, odd,
          cards: shuffle([
            { id: 1, char: main, isOdd: false },
            { id: 2, char: main, isOdd: false },
            { id: 3, char: main, isOdd: false },
            { id: 4, char: odd, isOdd: true }
          ])
        };
        render();
      },
      pickOdd(cid) {
        const c = State.gOdd.round.cards.find(x => x.id === cid);
        recordAttempt({ kind: 'letter', id: State.gOdd.round.odd, isCorrect: c.isOdd, chosen: c.isOdd ? null : c.char, activityLabel: 'Jeu : Intrus' });
        if (c.isOdd) {
          AudioEngine.speak(LETTERS_DATA[State.gOdd.round.odd].sound);
          State.gOdd.wins += 1;
          if (State.gOdd.wins === 4) awardBadge('game_odd', 'Œil de Lynx', 'عَيْنٌ ذَكِيَّةٌ');
          render();
          setTimeout(() => this.initOdd(), 900);
        } else {
          render();
        }
      },

      initMemory() {
        const pairs = [
          { letter: 'ب', wordId: 'bab' },
          { letter: 'ت', wordId: 'tuffaha' },
          { letter: 'ق', wordId: 'qitta' },
          { letter: 'ش', wordId: 'shams' }
        ];
        const deck = [];
        pairs.forEach(p => {
          deck.push({ uid: `L_${p.letter}`, pairKey: p.letter, type: 'letter', letter: p.letter });
          deck.push({ uid: `W_${p.wordId}`, pairKey: p.letter, type: 'word', wordId: p.wordId });
        });
        State.gMem = { cards: shuffle(deck), flipped: [], matched: [] };
        render();
      },
      flipCard(uid) {
        const m = State.gMem;
        const card = m.cards.find(c => c.uid === uid);
        if (!card || m.flipped.length === 2 || m.flipped.some(f => f.uid === uid) || m.matched.includes(card.pairKey)) return;
        m.flipped.push(card);
        if (card.type === 'letter') AudioEngine.speak(LETTERS_DATA[card.letter].sound);
        else AudioEngine.speak(VOCABULARY.find(w => w.id === card.wordId)?.ar);

        if (m.flipped.length === 2) {
          if (m.flipped[0].pairKey === m.flipped[1].pairKey) {
            m.matched.push(card.pairKey);
            m.flipped = [];
            recordAttempt({ kind: 'letter', id: card.pairKey, isCorrect: true, activityLabel: 'Jeu : Mémoire' });
            if (m.matched.length === 4) awardBadge('game_memory', 'Mémoire Magique', 'ذَاكِرَةٌ قَوِيَّةٌ');
          } else {
            render();
            setTimeout(() => { m.flipped = []; render(); }, 900);
            return;
          }
        }
        render();
      },

      initBuildWord(specificWord = null) {
        const words = VOCABULARY.filter(w => State.teacherConfig.selectedWordIds.includes(w.id) && w.syllables.length >= 2);
        const target = specificWord || randomFrom(words.length ? words : VOCABULARY.slice(0, 10));
        State.gBuild = { word: target, picked: [], pool: shuffle(target.syllables), status: null };
        AudioEngine.speak(target.ar);
        render();
      },
      pickBuildSyl(idx) {
        const g = State.gBuild;
        g.picked.push(g.pool[idx]);
        g.pool.splice(idx, 1);
        if (g.pool.length === 0) {
          const ok = g.picked.join('') === g.word.syllables.join('');
          g.status = ok ? 'ok' : 'retry';
          recordAttempt({ kind: 'word', id: g.word.id, isCorrect: ok, activityLabel: 'Jeu : Construis le mot' });
          if (ok) {
            awardBadge('game_build', 'Architecte des Mots', 'بَانِيَةُ الْكَلِمَاتِ');
            render();
            setTimeout(() => this.initBuildWord(), 1050);
            return;
          }
        }
        render();
      },

      initMatchWord() {
        const words = VOCABULARY.filter(w => State.teacherConfig.selectedWordIds.includes(w.id));
        const pool = words.length >= 3 ? words : VOCABULARY.slice(0, 12);
        const t = randomFrom(pool);
        const others = shuffle(pool.filter(w => w.id !== t.id)).slice(0, Math.min(getChoiceCount() - 1, 3));
        State.gMatch = { target: t, opts: shuffle([t, ...others]) };
        render();
      },
      pickMatchWord(wid) {
        const ok = wid === State.gMatch.target.id;
        recordAttempt({ kind: 'word', id: State.gMatch.target.id, isCorrect: ok, activityLabel: 'Jeu : Mot & Image' });
        if (ok) {
          AudioEngine.speak(State.gMatch.target.ar);
          awardBadge('game_match', 'Lectrice Éclair', 'قَارِئَةٌ مَاهِرَةٌ');
          render();
          setTimeout(() => this.initMatchWord(), 950);
        } else {
          render();
        }
      },

      /* --- Teacher Dashboard --- */
      unlockTeacher() {
        const inp = document.getElementById('teacher-pin-input');
        if (inp && inp.value.trim() === '1234') {
          State.teacherUnlocked = true;
          State.pinError = false;
        } else {
          State.pinError = true;
        }
        render();
      },
      setDifficulty(d) {
        State.teacherConfig.difficulty = d;
        saveProgress();
        render();
      },
      toggleFocusLetter(ch) {
        const arr = State.teacherConfig.focusLetters;
        if (arr.includes(ch)) {
          if (arr.length > 1) State.teacherConfig.focusLetters = arr.filter(x => x !== ch);
        } else {
          State.teacherConfig.focusLetters.push(ch);
        }
        saveProgress();
        render();
      },
      resetCategory(kind) {
        Object.keys(State.stats).forEach(k => {
          if (k.startsWith(`${kind}:`)) delete State.stats[k];
        });
        State.reviewQueue = State.reviewQueue.filter(i => i.kind !== kind);
        saveProgress();
        render();
      }
    };

    function renderDiagnostic() {
      const questions = [
        { kind: 'letter', id: 'ب', promptFr: 'Écoute et trouve la lettre !', audio: 'بَ', options: ['ب', 'ت', 'ث'] },
        { kind: 'letter', id: 'ج', promptFr: 'Où est cette lettre ?', audio: 'جَ', options: ['ج', 'ح', 'خ'] },
        { kind: 'letter', id: 'ش', promptFr: 'Trouve la lettre que tu entends :', audio: 'شَ', options: ['س', 'ش', 'ص'] },
        { kind: 'haraka', id: 'fatha', promptFr: 'Écoute la voyelle sur la lettre :', audio: 'بَ', options: ['fatha', 'damma', 'kasra'] },
        { kind: 'haraka', id: 'kasra', promptFr: 'Quelle est cette voyelle ?', audio: 'بِ', options: ['fatha', 'damma', 'kasra'] },
        { kind: 'word', id: 'bab', promptFr: 'Quel mot veut dire « Porte » ?', audio: 'بَابٌ', options: ['bab', 'kitab', 'qalam'] }
      ];

      if (State.diag.done) {
        return `
          <div class="bg-white rounded-3xl p-8 border-2 border-purple-200 text-center max-w-xl mx-auto space-y-5 animate-pop">
            <div class="flex justify-center">${getMascotSVG('excited', 110)}</div>
            <h2 class="text-2xl font-black text-purple-900">Bravo ! Tu as terminé le Défi Découverte ! 🎉</h2>
            <p class="arabic-text text-2xl font-bold text-pink-600">أَحْسَنْتِ! لَقَدْ أَنْهَيْتِ التَّحَدِّي!</p>
            <div class="flex flex-wrap justify-center gap-3 pt-2">
              <button onclick="App.go('unit1')" class="px-6 py-3 rounded-2xl bg-purple-600 text-white font-extrabold cursor-pointer">Commencer l’Unité 1</button>
              <button onclick="App.go('home')" class="px-6 py-3 rounded-2xl bg-slate-100 text-slate-700 font-extrabold cursor-pointer">Accueil</button>
            </div>
          </div>`;
      }

      const q = questions[State.diag.step];
      return `
        <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-purple-200 max-w-2xl mx-auto text-center space-y-6 animate-pop">
          <div class="flex items-center justify-between text-sm font-extrabold text-purple-700">
            <span>Défi Découverte ✨</span>
            <span>Étape ${State.diag.step + 1} / ${questions.length}</span>
          </div>
          <div class="w-full h-3 rounded-full bg-purple-100 overflow-hidden">
            <div class="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all" style="width:${((State.diag.step + 1) / questions.length) * 100}%"></div>
          </div>
          <h2 class="text-2xl font-black text-purple-900">${q.promptFr}</h2>
          <button onclick="App.speak('${q.audio}')" class="inline-flex items-center gap-2 px-7 py-3.5 rounded-2xl bg-sky-500 text-white font-black text-lg shadow-md cursor-pointer">${ICONS.volume} Écouter</button>
          <div class="grid grid-cols-3 gap-4 pt-2">
            ${q.options.map(opt => {
              let label = opt;
              if (q.kind === 'haraka') label = 'ب' + HARAKAT_DATA.find(x => x.id === opt).mark;
              else if (q.kind === 'word') label = VOCABULARY.find(w => w.id === opt)?.ar;
              return `<button onclick="App.diagAnswer('${opt}', '${q.kind}', '${q.id}')" class="py-6 rounded-3xl bg-purple-50 border-2 border-purple-200 hover:border-pink-400 hover:scale-105 transition shadow-xs cursor-pointer"><span class="arabic-text text-5xl sm:text-6xl font-bold text-slate-900">${label}</span></button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function renderReview() {
      if (State.reviewQueue.length === 0) {
        return `
          <div class="bg-white rounded-3xl p-8 border-2 border-emerald-200 text-center max-w-lg mx-auto space-y-4 animate-pop">
            <div class="flex justify-center">${getMascotSVG('excited', 96)}</div>
            <h2 class="text-2xl font-black text-emerald-700">Tout est révisé ! Bravo ! 🌟</h2>
            <p class="arabic-text text-2xl font-bold text-emerald-600">أَحْسَنْتِ! لَا تُوجَدُ أَخْطَاءٌ لِلْمُرَاجَعَةِ.</p>
            <button onclick="App.go('home')" class="px-6 py-3 rounded-2xl bg-emerald-500 text-white font-extrabold cursor-pointer">Retour à l’accueil</button>
          </div>`;
      }

      const item = State.reviewQueue[State.revIdx % State.reviewQueue.length];
      let options = [];
      let audioText = '';

      if (item.kind === 'letter') {
        const grp = LETTER_GROUPS.find(g => g.letters.includes(item.id)) || LETTER_GROUPS[0];
        options = grp.letters.map(l => ({ val: l, label: l }));
        audioText = LETTERS_DATA[item.id]?.sound || item.id;
      } else if (item.kind === 'haraka') {
        options = HARAKAT_DATA.slice(0, 3).map(h => ({ val: h.id, label: 'ب' + h.mark }));
        const hObj = HARAKAT_DATA.find(h => h.id === item.id) || HARAKAT_DATA[0];
        audioText = 'ب' + hObj.mark;
      } else {
        const wObj = VOCABULARY.find(w => w.id === item.id) || VOCABULARY[0];
        const others = VOCABULARY.filter(w => w.id !== wObj.id).slice(0, 2);
        options = [wObj, ...others].map(w => ({ val: w.id, label: w.ar }));
        audioText = wObj.ar;
      }

      return `
        <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-amber-300 max-w-xl mx-auto text-center space-y-6 animate-pop">
          <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-100 text-amber-800 font-extrabold text-sm">🪄 Révision Magique (${State.reviewQueue.length} à consolider)</div>
          <h2 class="text-2xl font-black text-purple-900">Écoute bien et choisis la bonne réponse !</h2>
          <button onclick="App.speak('${audioText}')" class="inline-flex items-center gap-2 px-7 py-3.5 rounded-2xl bg-amber-500 text-white font-black text-lg shadow-md cursor-pointer">${ICONS.volume} Écouter</button>
          <div class="grid grid-cols-3 gap-4">
            ${options.map(o => `
              <button onclick="App.reviewAnswer('${o.val}', '${item.kind}', '${item.id}')" class="py-6 rounded-3xl bg-amber-50 border-2 border-amber-200 hover:border-amber-500 transition cursor-pointer">
                <span class="arabic-text text-5xl font-bold text-slate-900">${o.label}</span>
              </button>
            `).join('')}
          </div>
        </div>`;
    }

                <button onclick="App.resetCategory('letter')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 cursor-pointer">Réinitialiser Lettres</button>
                <button onclick="App.resetCategory('haraka')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 cursor-pointer">Réinitialiser Harakat</button>
                <button onclick="App.resetCategory('word')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 cursor-pointer">Réinitialiser Mots</button>
              </div>
            </div>

            <div class="bg-white rounded-3xl p-5 border border-slate-200 space-y-3">
              <h2 class="font-black text-lg text-slate-900">⏱️ Plan de Séance Preply (Lancement direct)</h2>
              ${[
                { time: '5 min', label: 'Échauffement & Révision Magique', view: 'review', game: null },
                { time: '8 min', label: 'Lettres similaires + Jeu des Points', view: 'games', game: 'dots' },
                { time: '8 min', label: 'Harakat & Train des Voyelles', view: 'unit2', game: null },
                { time: '10 min', label: 'Syllabes & Mots illustrés', view: 'unit3', game: null },
                { time: '5 min', label: 'Phrases & Chasseur de Lettres', view: 'unit5', game: null }
              ].map(st => `
                <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200">
                  <div class="flex items-center gap-3">
                    <span class="px-2.5 py-1 rounded-lg bg-sky-100 text-sky-800 font-black text-xs">${st.time}</span>
                    <span class="font-bold text-sm text-slate-800">${st.label}</span>
                  </div>
                  <button onclick="${st.game ? `App.startGame('${st.game}')` : `App.go('${st.view}')`}" class="px-3 py-1.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs cursor-pointer">Lancer</button>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-white rounded-3xl p-5 border border-slate-200 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <h2 class="font-black text-lg text-slate-900">🎛️ Personnalisation de la séance</h2>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-500">Difficulté :</span>
                ${['easy', 'medium', 'challenge'].map(d => `
                  <button onclick="App.setDifficulty('${d}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer ${State.teacherConfig.difficulty === d ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-700'}">
                    ${d === 'easy' ? 'Facile (3 choix)' : d === 'medium' ? 'Moyen (4 choix)' : 'Défi (5 choix)'}
                  </button>
                `).join('')}
              </div>
            </div>
            <div>
              <p class="text-xs font-bold uppercase text-slate-400 mb-2">Lettres ciblées pour les jeux :</p>
              <div class="flex flex-wrap gap-2">
                ${Object.keys(LETTERS_DATA).map(ch => {
                  const active = State.teacherConfig.focusLetters.includes(ch);
                  return `<button onclick="App.toggleFocusLetter('${ch}')" class="w-11 h-11 rounded-xl arabic-text text-2xl font-bold border-2 transition cursor-pointer ${active ? 'bg-pink-500 text-white border-pink-500' : 'bg-slate-50 text-slate-600 border-slate-200'}">${ch}</button>`;
                }).join('')}
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderModals() {
      let html = '';

      if (State.remediation) {
        const { kind, expected, chosen } = State.remediation;
        const isL = kind === 'letter' && LETTERS_DATA[expected] && LETTERS_DATA[chosen];
        const isH = kind === 'haraka';
        const expL = isL ? LETTERS_DATA[expected] : null;
        const chL = isL ? LETTERS_DATA[chosen] : null;
        const expH = isH ? HARAKAT_DATA.find(h => h.id === expected) : null;
        const chH = isH ? HARAKAT_DATA.find(h => h.id === chosen) : null;

        html += `
          <div class="fixed inset-0 z-50 bg-slate-900/45 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl border-4 border-purple-200 animate-pop">
              <div class="flex items-center gap-4 mb-4">
                ${getMascotSVG('happy', 70)}
                <div>
                  <h3 class="text-xl font-extrabold text-purple-800">Regardons la différence ensemble !</h3>
                  <p class="arabic-text text-xl font-bold text-pink-600">لِنَنْظُرْ إِلَى الْفَرْقِ مَعًا!</p>
                </div>
              </div>
              ${isL ? `
                <div class="grid grid-cols-2 gap-4 my-4">
                  <div class="rounded-2xl bg-emerald-50 border-2 border-emerald-300 p-4 text-center">
                    <span class="inline-block px-3 py-0.5 rounded-full bg-emerald-500 text-white text-xs font-bold mb-2">La bonne lettre</span>
                    <div class="arabic-text text-7xl font-bold text-emerald-700 my-1">${expL.char}</div>
                    <p class="font-bold text-slate-800">${expL.nameFr} (${expL.soundFr})</p>
                    <p class="text-sm font-semibold text-emerald-700 mt-1">${expL.dotDescFr}</p>
                    <button onclick="App.speak('${expL.sound}')" class="mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-500 text-white font-bold text-sm cursor-pointer">${ICONS.volume} Écouter</button>
                  </div>
                  <div class="rounded-2xl bg-amber-50 border-2 border-amber-300 p-4 text-center">
                    <span class="inline-block px-3 py-0.5 rounded-full bg-amber-500 text-white text-xs font-bold mb-2">Celle choisie</span>
                    <div class="arabic-text text-7xl font-bold text-amber-700 my-1">${chL.char}</div>
                    <p class="font-bold text-slate-800">${chL.nameFr} (${chL.soundFr})</p>
                    <p class="text-sm font-semibold text-amber-700 mt-1">${chL.dotDescFr}</p>
                    <button onclick="App.speak('${chL.sound}')" class="mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-amber-500 text-white font-bold text-sm cursor-pointer">${ICONS.volume} Écouter</button>
                  </div>
                </div>
              ` : ''}
              ${isH && expH ? `
                <div class="grid grid-cols-2 gap-4 my-4">
                  <div class="rounded-2xl bg-emerald-50 border-2 border-emerald-300 p-4 text-center">
                    <span class="inline-block px-3 py-0.5 rounded-full bg-emerald-500 text-white text-xs font-bold mb-2">La bonne voyelle</span>
                    <div class="arabic-text text-7xl font-bold text-emerald-700 my-1">ب${expH.mark}</div>
                    <p class="font-bold text-slate-800">${expH.nameFr}</p>
                    <button onclick="App.speak('ب${expH.mark}')" class="mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-500 text-white font-bold text-sm cursor-pointer">${ICONS.volume} Écouter</button>
                  </div>
                  ${chH ? `
                    <div class="rounded-2xl bg-amber-50 border-2 border-amber-300 p-4 text-center">
                      <span class="inline-block px-3 py-0.5 rounded-full bg-amber-500 text-white text-xs font-bold mb-2">Celle choisie</span>
                      <div class="arabic-text text-7xl font-bold text-amber-700 my-1">ب${chH.mark}</div>
                      <p class="font-bold text-slate-800">${chH.nameFr}</p>
                      <button onclick="App.speak('ب${chH.mark}')" class="mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-amber-500 text-white font-bold text-sm cursor-pointer">${ICONS.volume} Écouter</button>
                    </div>
                  ` : ''}
                </div>
              ` : ''}
              <div class="mt-5 flex justify-center">
                <button onclick="App.closeRemediation()" class="px-8 py-3 rounded-2xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-extrabold text-lg shadow-md cursor-pointer">J’ai compris ! On continue ✨</button>
              </div>
            </div>
          </div>`;
      }

      if (State.showBadges) {
        html += `
          <div class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-4 border-pink-200 animate-pop">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-black text-purple-900">🏆 Mes Badges (${State.badges.length})</h3>
                <button onclick="App.openBadges(false)" class="px-3 py-1 rounded-full bg-slate-100 hover:bg-slate-200 font-bold cursor-pointer">✕</button>
              </div>
              ${State.badges.length === 0 ? `
                <div class="text-center py-6">
                  <div class="flex justify-center">${getMascotSVG('happy', 84)}</div>
                  <p class="mt-3 font-bold text-slate-600">Termine un jeu ou une unité pour gagner ton premier badge !</p>
                  <p class="arabic-text text-lg text-purple-700">أَكْمِلِي نَشَاطًا لِتَحْصُلِي عَلَى أَوَّلِ شَارَةٍ!</p>
                </div>
              ` : `
                <div class="grid grid-cols-2 gap-3">
                  ${State.badges.map(b => `
                    <div class="p-3 rounded-2xl bg-gradient-to-br from-amber-50 to-pink-50 border-2 border-amber-200 text-center">
                      <div class="text-2xl mb-1">⭐</div>
                      <p class="font-extrabold text-sm text-purple-900">${b.titleFr}</p>
                      <p class="arabic-text text-sm text-pink-600 font-bold">${b.titleAr}</p>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>`;
      }

      document.getElementById('modal-root').innerHTML = html;
    }

    function render() {
      renderHeader();
      const main = document.getElementById('app-main');
      switch (State.view) {
        case 'home': main.innerHTML = renderHome(); break;
        case 'unit1': main.innerHTML = renderUnit1(); break;
        case 'unit2': main.innerHTML = renderUnit2(); break;
        case 'unit3': main.innerHTML = renderUnit3(); break;
        case 'unit4': main.innerHTML = renderUnit4(); break;
        case 'unit5': main.innerHTML = renderUnit5(); break;
        case 'games': main.innerHTML = renderGames(); break;
        case 'diagnostic': main.innerHTML = renderDiagnostic(); break;
        case 'review': main.innerHTML = renderReview(); break;
        case 'teacher': main.innerHTML = renderTeacher(); break;
        default: main.innerHTML = renderHome();
      }
      renderModals();
    }

    // Boot Application
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
